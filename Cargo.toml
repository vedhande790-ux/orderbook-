[package]
name = "simulated_orderbook"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
